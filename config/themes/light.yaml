#--------------------#
# light.yaml
# your editable light theme (copied from config/defaults/light_theme.yaml)
# field reference in docs/UI_GUIDE.md, themes
#--------------------#
name: light
mode: light
font_scale: 1.0
colors:
  background: "#f5f5f5"
  surface: "#ffffff"
  text: "#1a1a1a"
  accent: "#0a66c2"
  border: "#d0d0d0"
  error: "#c0392b"
  # trace colors, handed out in order as signals are plotted
  plot_palette:
    - "#0a66c2"
    - "#d62728"
    - "#2ca02c"
    - "#9467bd"
    - "#ff7f0e"
    - "#17becf"
