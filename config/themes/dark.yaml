#--------------------#
# dark.yaml
# your editable dark theme (copied from config/defaults/dark_theme.yaml)
# field reference in docs/UI_GUIDE.md, themes
#--------------------#
name: dark
mode: dark
font_scale: 1.0
colors:
  background: "#1e1e1e"
  surface: "#2b2b2b"
  text: "#e6e6e6"
  accent: "#4da3ff"
  border: "#444444"
  error: "#ff6b6b"
  # trace colors, handed out in order as signals are plotted
  plot_palette:
    - "#4da3ff"
    - "#ff6b6b"
    - "#7ed957"
    - "#c792ea"
    - "#f2b134"
    - "#5ad8e6"
